<!DOCTYPE html>
<html>
<head>
    <title>Clear SolvixTrack Storage</title>
</head>
<body>
    <h1>Clear SolvixTrack Storage</h1>
    <button onclick="clearStorage()">Clear All Data</button>
    <div id="result"></div>
    
    <script>
        function clearStorage() {
            // Clear all localStorage
            localStorage.clear();
            
            // Also clear specific keys
            localStorage.removeItem('solvixtrack_employees');
            localStorage.removeItem('solvixtrack_tasks');
            localStorage.removeItem('solvixtrack_notifications');
            localStorage.removeItem('solvixtrack_user');
            
            document.getElementById('result').innerHTML = '<p style="color: green;">All data cleared! Please close this tab and refresh your SolvixTrack application.</p>';
        }
        
        // Auto-clear on load
        clearStorage();
    </script>
</body>
</html>
